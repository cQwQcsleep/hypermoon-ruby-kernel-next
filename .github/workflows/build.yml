name: build-kernel

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # One KSU build per manager: each manager pins its own UAPI revision,
        # and a kernel reporting a different value is shown as "update the
        # manager" or "incompatible".
        variant:
          - vanilla
          - ksu-official
          - ksu-next
          - ksu-sukisu
          - ksu-resukisu
          - ksu-mksu
          - ksu-rksu
    name: build-${{ matrix.variant }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio libelf-dev libssl-dev zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          # HyperMoon 1.0.2 is built with this AOSP prebuilt (clang 11.0.1,
          # r383902) and that is the combination proven to boot on ruby.
          mkdir -p "$HOME/toolchain"
          cd "$HOME/toolchain"
          curl -sSL -o clang.tar.gz \
            "https://github.com/techyminati/android_prebuilts_clang_host_linux-x86_clang-6443078/archive/refs/heads/11.0.1.tar.gz"
          mkdir -p clang
          tar -xzf clang.tar.gz -C clang --strip-components=1
          "$HOME/toolchain/clang/bin/clang" --version

      - name: Build kernel (${{ matrix.variant }})
        run: |
          export LLVM_DIR="$HOME/toolchain/clang"
          export JOBS="$(nproc)"
          bash scripts/build_kernel.sh "${{ matrix.variant }}"

      - name: Package AnyKernel3 (${{ matrix.variant }})
        run: bash scripts/package_anykernel.sh "${{ matrix.variant }}"

      - name: Upload kernel (${{ matrix.variant }})
        uses: actions/upload-artifact@v4
        with:
          name: hypermoon-ruby-${{ matrix.variant }}
          path: |
            dist/*.zip
            out-${{ matrix.variant }}/System.map
          if-no-files-found: error

  release:
    # Push a tag (v*) to turn the artifacts of that build into a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checksums
        run: |
          cd artifacts
          find . -name '*.zip' -exec sha256sum {} \; | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/SHA256SUMS
          generate_release_notes: true

